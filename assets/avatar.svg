<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer glowing circle -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="url(#neonGrad)" stroke-width="4" filter="url(#glow)"/>
  <circle cx="200" cy="200" r="180" fill="url(#bgGrad)"/>
  
  <!-- Grid background decor -->
  <path d="M 40 200 H 360 M 200 40 V 360" stroke="rgba(255,255,255,0.05)" stroke-width="2"/>
  <circle cx="200" cy="200" r="120" fill="none" stroke="rgba(99,102,241,0.15)" stroke-width="1.5" stroke-dasharray="6,6"/>
  
  <!-- Developer Avatar Silhouette & hoodie -->
  <path d="M 110 350 C 110 280, 150 250, 200 250 C 250 250, 290 280, 290 350 Z" fill="#4338ca"/>
  <path d="M 140 350 L 200 270 L 260 350 Z" fill="#312e81"/>
  <!-- Head / Face -->
  <circle cx="200" cy="180" r="55" fill="url(#skinGrad)"/>
  <!-- Stylish hair & headphones -->
  <path d="M 145 170 C 145 120, 180 110, 215 115 C 245 120, 255 140, 255 170 C 240 160, 220 155, 200 155 C 170 155, 155 165, 145 170 Z" fill="#1e1b4b"/>
  <!-- Glasses / Cyber visor -->
  <rect x="160" y="165" width="80" height="24" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
  <line x1="168" y1="177" x2="232" y2="177" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,2"/>
  <!-- Headphones -->
  <path d="M 140 170 Q 140 115 200 115 Q 260 115 260 170" fill="none" stroke="#6366f1" stroke-width="6"/>
  <rect x="133" y="160" width="16" height="30" rx="8" fill="#ec4899"/>
  <rect x="251" y="160" width="16" height="30" rx="8" fill="#ec4899"/>
  
  <!-- Floating tech badge icons -->
  <g transform="translate(60, 90)">
    <rect width="65" height="30" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
    <text x="32" y="20" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">&lt;DEV/&gt;</text>
  </g>
  <g transform="translate(275, 90)">
    <rect width="65" height="30" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="32" y="20" fill="#34d399" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">GUAP</text>
  </g>
  
  <!-- Status online dot -->
  <circle cx="280" cy="280" r="14" fill="#10b981" stroke="#0f172a" stroke-width="3" filter="url(#glow)"/>
</svg>